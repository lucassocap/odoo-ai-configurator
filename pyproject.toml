[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-ai-configurator"
version = "0.1.0"
description = "AI-powered universal Odoo configuration system"
authors = [{name = "Lucas Napoli"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
odoo-configure = "odoo_ai_configurator.cli:main"
