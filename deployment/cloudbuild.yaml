steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/odoo-multitenant:$COMMIT_SHA", "."]

  # Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/odoo-multitenant:$COMMIT_SHA"]

  # Tag as latest
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "tag",
        "gcr.io/$PROJECT_ID/odoo-multitenant:$COMMIT_SHA",
        "gcr.io/$PROJECT_ID/odoo-multitenant:latest",
      ]

  # Push latest tag
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/odoo-multitenant:latest"]

images:
  - "gcr.io/$PROJECT_ID/odoo-multitenant:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/odoo-multitenant:latest"

options:
  machineType: "N1_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
